<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title>Kristian Liverød Command Center</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="app-rail" aria-label="Apper">
      <div class="brand-mark" aria-label="Kristian Liverød">
        <span class="brand-k">K</span><span class="brand-l">L</span>
      </div>
      <nav id="app-nav" class="app-nav"></nav>
      <div class="rail-clock" aria-live="off">
        <strong id="clock-time">--:--</strong>
        <span id="clock-date">--</span>
      </div>
    </aside>

    <section class="shell-main">
      <header class="shell-header">
        <div>
          <p class="eyebrow">KRISTIAN LIVERØD</p>
          <div class="title-line">
            <h1 id="app-title">Command Center</h1>
            <span class="version-pill">V0</span>
          </div>
        </div>
        <div id="app-status" class="shell-status" aria-live="polite">
          <span class="status-dot neutral"></span>
          <span>Starter</span>
        </div>
      </header>
      <main id="app-content" class="app-content" tabindex="-1"></main>
    </section>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
